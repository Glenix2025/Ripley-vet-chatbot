Monday–Friday 7:30am–6pm and Saturday 8am–12:30pm, closed Sundays. Public holiday hours aren't published — please call 07 3816 4717 to confirm."}, {"id": "payments", "triggers": ["payment", " pay", "afterpay", "zip pay", "vetpay", "buy now pay later", "bnpl", "credit card", "gap only", "gaponly"], "answer": "We accept EFTPOS, Visa and Mastercard, cash, GapOnly, and VetPay. VetPay is our payment plan option (5% surcharge, 20% deposit plus admin fee, fortnightly repayments) — it's best to apply before your visit."}, {"id": "insurance", "triggers": ["insurance", "pet insurance", "claim"], "answer": "Petcover is our preferred insurance partner with direct claims support, and GapOnly is integrated on-site so you only pay the gap between your invoice and your benefit. We also accept most other insurers."}, {"id": "doctors", "triggers": ["vet ", "vets", "doctor", "who are the vets", "how many vets", "veterinarian"], "answer": "Our current team has 5 vets: Dr Andrew Hemming (Senior Vet and owner), Dr Jessica Biddle (Head Vet, emergency/critical care), Dr Katie Park, Dr Sam Lee, and Dr Kerrie Kuok (wildlife/exotics, speaks English, Cantonese and Mandarin)."}, {"id": "nursing", "triggers": ["nurse", "nurses", "vet nurse", "nursing", "support staff", "receptionist"], "answer": "Yes — our nursing team is led by Head Veterinary Nurse Stephanie Robinson, supported by several nurses and veterinary/client liaisons, some of whom are current UQ veterinary science students."}, {"id": "services", "triggers": ["services", "what do you offer", "what can you treat"], "answer": "We offer consultations, preventative medicine, surgery, anaesthesia, dentistry, X-ray and ultrasound, diagnostics, vaccinations and titre testing, house calls, puppy preschool, visiting specialists, and euthanasia."}, {"id": "puppy", "triggers": ["puppy preschool", "puppy school", "puppy training"], "answer": "Yes — our puppy preschool runs for 5 weeks with classes limited to 5 participants, for puppies roughly 8–14 weeks old. Current price and schedule aren't published — call 07 3816 4717 to enrol and confirm details."}, {"id": "pricing", "triggers": ["price", "cost", "how much", "fees", " fee ", "consult cost", "cat consult", "dog consult", "checkup cost"], "answer": "Prices aren't published on our website. We discuss costs with you before treatment except in emergencies — call 07 3816 4717 for a quote."}, {"id": "boarding", "triggers": ["boarding", "board my cat", "cat boarding", "kennel", "dog boarding"], "answer": "Boarding isn't listed among our services — please call 07 3816 4717 if you'd like us to point you to a local option."}, {"id": "housecalls", "triggers": ["house call", "home visit", "at home"], "answer": "Yes, we offer house calls within and around the Ripley community region — for check-ups, general consults, or at-home euthanasia. Advance notice is appreciated."}, {"id": "dentistry", "triggers": ["dental", "teeth", "dentistry"], "answer": "We treat chipped/fractured teeth, decay, gum inflammation, infections and oral lumps, with dental work done under anaesthesia including cleaning, scaling and dental X-rays. A pre-anaesthetic blood test is always run first."}, {"id": "referral", "triggers": ["referral", "specialist", "refer"], "answer": "We have visiting specialists in cardiology, abdominal ultrasound, and surgery, plus a referral relationship with an emergency centre about 20–30 minutes away for CT/MRI and overnight care."}, {"id": "newclient", "triggers": ["new client", "first visit", "new patient", "sign up"], "answer": "Welcome! Book online, call 07 3816 4717, or email admin@ripleyvet.com.au to register — bring any previous vet records if you have them."}, {"id": "differentiator", "triggers": ["why choose", "what makes", "different from other", "asava", "accredited"], "answer": "We're an ASAVA-Accredited Veterinary Hospital, one of only four in Queensland, in a purpose-built facility with specialist-grade dental, lab and blood-testing equipment."}, {"id": "story", "triggers": ["your story", "philosophy", "about ripley vet"], "answer": "Founded in 2018 by Andrew and Sarah, we aim to be a high quality and relaxed place for all your animal's health needs, built on respect, trust and open communication."}, {"id": "cancellation", "triggers": ["cancel", "reschedule", "change my appointment"], "answer": "Our cancellation/rescheduling policy isn't published online — please call 07 3816 4717 as early as you can to change your appointment."}], "testCases": [{"name": "species pricing", "input": "how much for a dog checkup", "expectIntentId": "pricing"}, {"name": "weekend hours", "input": "are you open saturday", "expectIntentId": "hours"}, {"name": "named toxin emergency", "input": "my dog ate chocolate", "expectIntentId": "emergency"}, {"name": "multi-symptom emergency", "input": "my cat is bleeding and won't wake up", "expectIntentId": "emergency"}, {"name": "non-emergency symptom", "input": "my dog has been limping a bit today", "expectIntentId": "symptom"}, {"name": "bare contact phrasing", "input": "contact number", "expectIntentId": "contact"}, {"name": "emergency false-positive guard", "input": "do you do blood tests", "expectIntentIdNot": "emergency"}, {"name": "booking", "input": "how do i book an appointment", "expectIntentId": "booking"}, {"name": "boarding not offered", "input": "do you offer boarding", "expectIntentId": "boarding"}, {"name": "pricing/symptom false-positive guard (fee vs feeling)", "input": "my dog is not feeling well today", "expectIntentId": "symptom"}, {"name": "car crash emergency (rash false-positive guard)", "input": "my dog was just in a car crash", "expectIntentId": "emergency"}, {"name": "open wound emergency (hours false-positive guard)", "input": "my cat has an open wound on her leg", "expectIntentId": "emergency"}, {"name": "booking false-positive guard (ate my/create collision)", "input": "can you create my booking for next week", "expectIntentIdNot": "emergency"}, {"name": "nursing   const root = document.getElementById('pw-root');

  style.textContent = `
    #pw-root{--primary:${CONFIG.colors.primary};--accent:${CONFIG.colors.accent};--dark:${CONFIG.colors.dark};--emergency:${CONFIG.colors.emergency};
      position:fixed;inset:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;z-index:999999;}
    #pw-root *{box-sizing:border-box;}
    .pw-launcher{position:fixed;bottom:20px;right:20px;width:64px;height:64px;border-radius:50%;background:var(--dark);
      box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;
      overflow:hidden;border:none;padding:0;z-index:2;}
    .pw-launcher img{width:100%;height:100%;object-fit:cover;}
    .pw-launcher.bounce{animation:pw-bounce .6s ease;}
    @keyframes pw-bounce{0%{transform:translateY(0);}30%{transform:translateY(-10px);}55%{transform:translateY(0);}75%{transform:translateY(-4px);}100%{transform:translateY(0);}}
    .pw-teaser{position:fixed;bottom:92px;right:20px;max-width:230px;background:var(--dark);color:#fff;border-radius:14px;
      padding:10px 14px 10px 12px;font-size:13.5px;line-height:1.35;box-shadow:0 4px 16px rgba(0,0,0,.22);pointer-events:auto;
      cursor:pointer;z-index:1;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;}
    .pw-teaser.show{opacity:1;transform:translateY(0);}
    .pw-teaser.card-open{opacity:0!important;transform:translateY(6px)!important;pointer-events:none!important;}
    .pw-teaser::after{content:"";position:absolute;bottom:-7px;right:26px;width:14px;height:14px;background:var(--dark);
      transform:rotate(45deg);}
    .pw-teaser-close{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--dark);
      border:none;font-size:12px;line-height:20px;text-align:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:0;}
    @media(max-width:420px){.pw-teaser{max-width:170px;font-size:12.5px;right:16px;}.pw-launcher{right:16px;bottom:16px;}}

    .pw-card{position:fixed;bottom:20px;right:20px;width:360px;max-height:min(600px,80vh);background:#fff;border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;pointer-events:auto;z-index:3;}
    .pw-card.open{display:flex;}
    @media(max-width:420px){.pw-card{width:calc(100vw - 24px);right:12px;bottom:12px;max-height:min(560px,78vh);}}

    .pw-header{background:var(--dark);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .pw-header img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff;}
    .pw-header-info{flex:1;min-width:0;}
    .pw-header-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pw-header-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .pw-status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
    .pw-status-dot.closed{background:#b7b7b7;}
    .pw-header-sub{font-size:11.5px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pw-header-emergency{background:var(--emergency);color:#fff;border:none;border-radius:8px;font-size:10.5px;font-weight:700;
      padding:6px 8px;cursor:pointer;flex-shrink:0;white-space:nowrap;text-decoration:none;display:inline-block;}
    .pw-header-close{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1;}

    .pw-menu{padding:16px;overflow-y:auto;flex:1;}
    .pw-menu-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;background:#f2f2f2;}
    .pw-menu-greet{text-align:center;font-size:14px;font-weight:600;color:#222;margin-bottom:2px;}
    .pw-menu-status-badge{text-align:center;font-size:11.5px;color:#555;margin-bottom:14px;}
    .pw-menu-status-badge b{color:var(--primary);}
    .pw-btn{display:block;width:100%;text-align:center;border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;
      cursor:pointer;margin-bottom:9px;text-decoration:none;box-sizing:border-box;}
    .pw-btn-emergency{background:var(--emergency);color:#fff;}
    .pw-btn-primary{background:var(--dark);color:#fff;}
    .pw-btn-secondary{background:#f0f0f2;color:var(--dark);}

    .pw-btn:hover{filter:brightness(1.08);}
    .pw-btn:active{transform:scale(.98);}
    .pw-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px;}
    .pw-chip{background:#f0f0f2;color:var(--primary);border:1px solid #e2e2e6;border-radius:16px;padding:6px 11px;font-size:12px;
      cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;}
    .pw-chip:hover{background:#e7e7ea;border-color:#d5d5da;}

    .pw-chat{display:none;flex-direction:column;flex:1;overflow:hidden;}
    .pw-chat.open{display:flex;}
    .pw-chat-back{background:transparent;border:none;color:#fff;font-size:13px;cursor:pointer;padding:0;margin-right:2px;}
    .pw-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafafa;}
    .pw-msg{max-width:82%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;}
    .pw-msg.bot{background:#fff;border:1px solid #eee;align-self:flex-start;color:#222;}
    .pw-msg.user{background:var(--dark);color:#fff;align-self:flex-end;}
    .pw-msg-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-self:flex-start;max-width:82%;}
    .pw-msg-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;align-self:flex-start;max-width:95%;}
    .pw-typing{align-self:flex-start;background:#fff;border:1px solid #eee;border-radius:13px;padding:9px 14px;display:inline-flex;gap:3px;}
    .pw-typing span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:pw-typing 1s infinite ease-in-out;}
    .pw-typing span:nth-child(2){animation-delay:.15s;}
    .pw-typing span:nth-child(3){animation-delay:.3s;}
    @keyframes pw-typing{0%,80%,100%{opacity:.3;transform:scale(.85);}40%{opacity:1;transform:scale(1);}}
    .pw-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #eee;flex-shrink:0;background:#fff;}
    .pw-input{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 14px;font-size:13.5px;outline:none;min-width:0;}
    .pw-send{background:var(--dark);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;}
  `;
  document.head.appendChild(style);

  root.innerHTML = `
    <button class="pw-launcher" id="pwLauncher" aria-label="Open chat"><img src="${CONFIG.launcherImage}" alt=""></button>
    <div class="pw-teaser" id="pwTeaser">
      <button class="pw-teaser-close" id="pwTeaserClose" aria-label="Dismiss">&times;</button>
      <span id="pwTeaserText"></span>
    </div>
    <div class="pw-card" id="pwCard">
      <div class="pw-header">
        <img src="${CONFIG.headerImage}" alt="">
        <div class="pw-header-info">
          <div class="pw-header-name"><span class="pw-status-dot" id="pwStatusDot"></span><span>${CONFIG.assistantName}</span></div>
          <div class="pw-header-sub" id="pwHeaderSub"></div>
        </div>
        <a class="pw-header-emergency" id="pwHeaderEmergency" href="#">Emergency</a>
        <button class="pw-header-close" id="pwCardClose" aria-label="Close">&times;</button>
      </div>
      <div class="pw-menu" id="pwMenu">
        <img class="pw-menu-avatar" src="${CONFIG.headerImage}" alt="">
        <div class="pw-menu-greet">Hi! I'm ${CONFIG.assistantName}.<br>How can I help?</div>
        <div class="pw-menu-status-badge" id="pwMenuStatusBadge"></div>
        <a href="#" class="pw-btn pw-btn-emergency" id="pwMenuEmergency">🚨 Emergency? Call now</a>
        <button class="pw-btn pw-btn-primary" id="pwStartChat">💬 Start a new chat</button>
        <a href="#" class="pw-btn pw-btn-secondary" id="pwBookOnline">Book Online</a>
        <div class="pw-chips" id="pwQuickChips"></div>
      </div>
      <div class="pw-chat" id="pwChat">
        <div class="pw-messages" id="pwMessages"></div>
        <div class="pw-input-row">
          <input class="pw-input" id="pwInput" type="text" placeholder="Type a message...">
          <button class="pw-send" id="pwSend">Send</button>
        </div>
      </div>
    </div>
  `;

  // ---------- Elements ----------
  const launcher = document.getElementById('pwLauncher');
  const teaser = document.getElementById('pwTeaser');
  const teaserText = document.getElementById('pwTeaserText');
  const teaserClose = document.getElementById('pwTeaserClose');
  const card = document.getElementById('pwCard');
  const menu = document.getElementById('pwMenu');
  const chat = document.getElementById('pwChat');
  const messagesEl = document.getElementById('pwMessages');
  const inputEl = document.getElementById('pwInput');
  const sendBtn = document.getElementById('pwSend');
  const startChatBtn = document.getElementById('pwStartChat');
  const bookOnlineBtn = document.getElementById('pwBookOnline');
  const menuEmergencyBtn = document.getElementById('pwMenuEmergency');
  const headerEmergencyBtn = document.getElementById('pwHeaderEmergency');
  const statusDot = document.getElementById('pwStatusDot');
  const headerSub = document.getElementById('pwHeaderSub');
  const menuStatusBadge = document.getElementById('pwMenuStatusBadge');
  const quickChipsEl = document.getElementById('pwQuickChips');

  teaserText.textContent = CONFIG.teaserText;

  // ---------- Honest button labelling ----------
  function applyBookingButton(){
    if(_CONFIG.bookingUrl){
      bookOnlineBtn.textContent = 'Book Online';
      bookOnlineBtn.href = _CONFIG.bookingUrl;
      bookOnlineBtn.target = '_blank';
      bookOnlineBtn.rel = 'noopener noreferrer';
    } else {
      bookOnlineBtn.textContent = 'Book Online (Call Us)';
      bookOnlineBtn.href = 'tel:' + CONFIG.phone.replace(/\\s+/g,'');
      bookOnlineBtn.removeAttribute('target');
    }
  }
  applyBookingButton();

  // ---------- Dynamic open/closed status ----------
  function getClinicNow(){
    const parts = new Intl.DateTimeFormat('en-US',{
      timeZone: _CONFIG.clinicTimeZone, hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short'
    }).formatToParts(new Date());
    let h=0,m=0,wd='Sun';
    parts.forEach(p=>{
      if(p.type==='hour') h=parseInt(p.value,10);
      if(p.type==='minute') m=parseInt(p.value,10);
      if(p.type==='weekday') wd=p.value;
    });
    const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    return {minutes:h*60+m, day:map[wd]};
  }
  function computeStatus(){
    const now = getClinicNow();
    const today = _CONFIG.businessHours[now.day];
    let open=false;
    if(today){
      const [oh,om]=today.open.split(':').map(Number);
      const [ch,cm]=today.close.split(':').map(Number);
      const openMin=oh*60+om, closeMin=ch*60+cm;
      open = now.minutes>=openMin && now.minutes<closeMin;
    }
    return {open, emergencyLabel: open ? CONFIG.emergency.openLabel : CONFIG.emergency.closedLabel,
            emergencyNumber: open ? CONFIG.emergency.openNumber : CONFIG.emergency.closedNumber};
  }
  function refreshStatus(){
    const s = computeStatus();
    statusDot.classList.toggle('closed', !s.open);
    headerSub.textContent = s.open ? CONFIG.hoursTextOpen : CONFIG.hoursTextClosed;
    menuStatusBadge.innerHTML = s.open
      ? '<b>Open now</b> · ' + CONFIG.hoursTextOpen
      : '<b>Closed</b> — ' + CONFIG.hoursTextClosed;
    [menuEmergencyBtn, headerEmergencyBtn].forEach(btn=>{
      btn.href = 'tel:' + s.emergencyNumber.replace(/\\s+/g,'');
      btn.title = s.emergencyLabel;
    });
    headerEmergencyBtn.textContent = s.open ? 'Emergency' : 'Emergency (after hours)';
    return s;
  }
  refreshStatus();
  setInterval(refreshStatus, 60000);

  // ---------- Quick intent chips ----------
  CONFIG.quickIntents.forEach(qi=>{
    const chip = document.createElement('button');
    chip.className='pw-chip';
    chip.textContent = qi.label;
    chip.addEventListener('click', ()=>{
      openChat();
      showChatView();
      if(onboarding.stage==='idle') messagesEl.innerHTML='';
      onboarding.stage='done';
      sendUserTurn(qi.question, true);
    });
    quickChipsEl.appendChild(chip);
  });

  // ---------- Launcher idle bounce ----------
  let bounceInterval = setInterval(()=>{
    if(!card.classList.contains('open')){
      launcher.classList.remove('bounce');
      requestAnimationFrame(()=>launcher.classList.add('bounce'));
    }
  }, 8000);

  // ---------- Teaser show / hide-while-open ----------
  let teaserDismissed = false;
  setTimeout(()=>{ if(!teaserDismissed) teaser.classList.add('show'); }, 1700);
  // While the chat card is open, the teaser bubble is fully hidden (not repositioned)
  // so it never overlaps the card. It reappears when the card closes, unless the
  // visitor already dismissed it via the teaser's own close (x) button.
  function syncTeaserVisibility(){
    teaser.classList.toggle('card-open', card.classList.contains('open'));
  }
  teaserClose.addEventListener('click', (e)=>{
    e.stopPropagation();
    teaserDismissed = true;
    teaser.classList.remove('show');
  });
  teaser.addEventListener('click', ()=>{ openChat(); });

  // ---------- Open / close card ----------
  function openChat(){
    card.classList.add('open');
    syncTeaserVisibility();
  }
  function closeChat(){
    card.classList.remove('open');
    syncTeaserVisibility();
  }
  launcher.addEventListener('click', openChat);
  document.getElementById('pwCardClose').addEventListener('click', closeChat);

  // ---------- Onboarding / intake state machine ----------
  const onboarding = {stage:'idle', name:null, pet:null};

  function showMenu(){
    menu.style.display='block';
    chat.classList.remove('open');
  }
  function showChatView(){
    menu.style.display='none';
    chat.classList.add('open');
  }

  startChatBtn.addEventListener('click', ()=>{
    showChatView();
    messagesEl.innerHTML='';
    onboarding.stage='name';
    onboarding.name=null; onboarding.pet=null;
    addBotMessage("Before we dive in, what's your name?");
  });

  // ---------- Messaging helpers ----------
  function addMessage(text, who){
    const div = document.createElement('div');
    div.className = 'pw-msg ' + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }
  function addBotLinks(links){
    if(!links || !links.length) return;
    const wrap = document.createElement('div');
    wrap.className='pw-msg-links';
    links.forEach(l=>{
      const a = document.createElement('a');
      a.href=l.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.className='pw-chip'; a.textContent=l.label;
      wrap.appendChild(a);
    });
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function addBotSuggestions(suggestions){
    if(!suggestions || !suggestions.length) return;
    const wrap = document.createElement('div');
    wrap.className='pw-msg-suggestions';
    suggestions.forEach(s=>{
      const b = document.createElement('button');
      b.className='pw-chip'; b.textContent=s;
      b.addEventListener('click', ()=>sendUserTurn(s, true));
      wrap.appendChild(b);
    });
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function addBotMessage(text, opts){
    opts = opts || {};
    addMessage(text, 'bot');
    addBotLinks(opts.links);
    addBotSuggestions(opts.suggestions);
  }
  function showTyping(){
    const div = document.createElement('div');
    div.className='pw-typing';
    div.id='pwTypingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }
  function botReply(text, opts, delay){
    const t = showTyping();
    setTimeout(()=>{
      t.remove();
      addBotMessage(text, opts);
    }, delay || 500);
  }

  // ---------- Emergency / symptom / KB matching ----------
  // Padding with a leading/trailing space lets triggers opt into word-boundary
  // matching (e.g. " pay" or " fee ") to avoid substring false-positives like
  // "spay".includes("pay") or "feeling".includes("fee") — see CONFIG triggers.
  function normalize(s){ return ' ' + (s||'').toLowerCase() + ' '; }

  function checkEmergency(msg){
    const m = normalize(msg);
    return CONFIG.emergencyTriggers.some(t=>m.includes(t));
  }
  function checkSymptom(msg){
    const m = normalize(msg);
    return CONFIG.symptomTriggers.some(t=>m.includes(t));
  }
  function matchIntent(msg){
    const m = normalize(msg);
    let best=null, bestScore=0;
    CONFIG.intents.forEach(intent=>{
      let score=0;
      intent.triggers.forEach(t=>{ if(m.includes(t)) score++; });
      if(score>bestScore){ bestScore=score; best=intent; }
    });
    return bestScore>0 ? best : null;
  }
  function emergencyAnswer(){
    const s = computeStatus();
    return {
      id:'emergency',
      text: "This sounds urgent. Please call " + s.emergencyLabel + " right away on " + s.emergencyNumber + ". Don't wait for a chat reply — a phone call gets your pet seen fastest.",
      links: [{label:'📞 Call ' + s.emergencyNumber, url:'tel:'+s.emergencyNumber.replace(/\\s+/g,'')}]
    };
  }
  function symptomAnswer(){
    return {
      id:'symptom',
      text: "I can't diagnose over chat, but that's worth a vet's eyes. It's best to book a standard appointment so we can take a proper look — call " + CONFIG.phone + " or use Book Online. If things get worse quickly (worsening pain, collapse, stops eating/drinking entirely, difficulty breathing), treat it as an emergency and call right away.",
    };
  }
  function fallbackAnswer(){
    return {
      id:'fallback',
      text: "I'm not sure about that one. You can call us on " + CONFIG.phone + " or email " + CONFIG.email + " and the team will help directly.",
      suggestions: CONFIG.quickIntents.slice(0,3).map(q=>q.question)
    };
  }

  function matchMessage(msg){
    if(checkEmergency(msg)) return emergencyAnswer();
    if(checkSymptom(msg)) return symptomAnswer();
    const intent = matchIntent(msg);
    if(intent) return {id:intent.id, text: typeof intent.answer==='function' ? intent.answer(_CONFIG) : intent.answer, links: intent.links, suggestions: intent.suggestions};
    return fallbackAnswer();
  }

  function sendUserTurn(text, skipEcho){
    if(!skipEcho) addMessage(text, 'user');
    else addMessage(text, 'user');

    if(onboarding.stage==='name'){
      onboarding.name = text.trim();
      onboarding.stage='petname';
      botReply("Lovely to meet you, " + onboarding.name + "! What's your pet's name?");
      return;
    }
    if(onboarding.stage==='petname'){
      onboarding.pet = text.trim();
      onboarding.stage='condition';
      botReply("Great — and what's going on with " + onboarding.pet + " today? You can describe what's happening, or just ask me about booking, hours, services and more.");
      return;
    }
    if(onboarding.stage==='condition'){
      onboarding.stage='done';
      const res = matchMessage(text);
      botReply("Thanks, " + onboarding.name + " — noted for " + onboarding.pet + ". " + res.text, {links:res.links, suggestions:res.suggestions});
      return;
    }
    // free-form / quick-intent path
    const res = matchMessage(text);
    botReply(res.text, {links:res.links, suggestions:res.suggestions});
  }

  sendBtn.addEventListener('click', ()=>{
    const v = inputEl.value.trim();
    if(!v) return;
    inputEl.value='';
    sendUserTurn(v, false);
  });
  inputEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); sendBtn.click(); }
  });

  // ---------- Test harness (opt-in only, never auto-runs) ----------
  const testNS = CONFIG.testNamespace || 'PWTEST';
  window[testNS] = {
    runAll: function(){
      const cases = CONFIG.testCases || [];
      let pass=0, fail=0;
      cases.forEach(c=>{
        const res = matchMessage(c.input);
        let ok = true;
        if(c.expectIntentId && res.id !== c.expectIntentId) ok=false;
        if(c.expectIntentIdNot && res.id === c.expectIntentIdNot) ok=false;
        if(c.expectContains && !res.text.toLowerCase().includes(c.expectContains.toLowerCase())) ok=false;
        if(c.expectNotContains && res.text.toLowerCase().includes(c.expectNotContains.toLowerCase())) ok=false;
        if(ok){ pass++; console.log('PASS:', c.name); }
        else { fail++; console.log('FAIL:', c.name, '-> got:', res.id, res.text); }
      });
      const s = computeStatus();
      const statusOk = typeof s.open === 'boolean' && !!s.emergencyLabel && !!s.emergencyNumber;
      console.log(statusOk ? 'PASS: status function well-formed' : 'FAIL: status function malformed', s);
      console.log('SUMMARY:', pass, 'passed,', fail, 'failed, out of', cases.length, '(+status check)');
      return {pass, fail, total: cases.length, statusOk};
    }
  };
  if(/[?&]${CONFIG.testQueryParam || 'pwtest'}=1/.test(location.search)){
    setTimeout(()=>window[testNS].runAll(), 300);
  }
})();
</script>
