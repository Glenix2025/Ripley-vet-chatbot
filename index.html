<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripley Vet Live Assistant</title>
<style>
  :root{
    --rv-dark:#2e2e2e;
    --rv-dark-2:#1c1c1c;
    --rv-red:#ff4040;
    --rv-red-dark:#d93636;
    --rv-mauve:#a64782;
    --rv-mauve-light:#f3e3ee;
    --rv-grey-bg:#f4f6f8;
    --rv-grey-bubble:#eef1f4;
    --rv-text:#232323;
    --rv-emergency:#d3382e;
    --rv-emergency-dark:#a92920;
    --rv-white:#ffffff;
  }
  *{box-sizing:border-box;}
  #rv-widget-root, #rv-widget-root *{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #rv-widget-root{position:fixed;bottom:0;right:0;z-index:999999;width:0;height:0;}

  /* ---------- Launcher ---------- */
  #rv-launcher{
    position:fixed;bottom:20px;right:20px;width:64px;height:64px;border-radius:50%;
    background:var(--rv-dark);box-shadow:0 6px 18px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    border:none;padding:0;overflow:hidden;transition:transform .15s ease;
  }
  #rv-launcher:hover{transform:scale(1.05);}
  #rv-launcher img{width:88%;height:88%;object-fit:contain;display:block;margin:auto;}
  #rv-launcher.rv-bounce{animation:rv-bounce .6s ease;}
  @keyframes rv-bounce{
    0%{transform:translateY(0);}
    30%{transform:translateY(-10px);}
    55%{transform:translateY(0);}
    75%{transform:translateY(-5px);}
    100%{transform:translateY(0);}
  }

  /* ---------- Teaser bubble ---------- */
  #rv-teaser{
    position:fixed;right:20px;bottom:94px;max-width:230px;
    background:var(--rv-dark-2);color:#fff;padding:12px 30px 12px 14px;border-radius:16px;
    font-size:13.5px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.22);
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s ease, transform .25s ease, bottom .2s ease;
  }
  #rv-teaser.rv-show{opacity:1;transform:translateY(0);pointer-events:auto;}
  #rv-teaser:after{
    content:"";position:absolute;right:24px;bottom:-7px;width:14px;height:14px;
    background:var(--rv-dark-2);transform:rotate(45deg);border-radius:2px;
  }
  #rv-teaser-close{
    position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;
    background:#fff;color:var(--rv-dark-2);border:none;font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  @media (max-width:420px){
    #rv-teaser{max-width:180px;font-size:12.5px;right:14px;}
    #rv-launcher{right:14px;}
  }

  /* ---------- Card ---------- */
  #rv-card{
    position:fixed;bottom:96px;right:20px;width:360px;max-width:calc(100vw - 28px);
    height:520px;max-height:calc(100vh - 120px);background:#fff;border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;
  }
  #rv-card.rv-open{display:flex;}
  @media (max-width:420px){
    #rv-card{right:14px;width:calc(100vw - 28px);}
  }

  /* header */
  .rv-header{background:var(--rv-dark);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .rv-header .rv-avatar{width:40px;height:40px;border-radius:50%;background:var(--rv-dark-2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .rv-header .rv-avatar img{width:88%;height:88%;object-fit:contain;}
  .rv-header-text{flex:1;min-width:0;}
  .rv-header-text .rv-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;}
  .rv-status-dot{width:8px;height:8px;border-radius:50%;background:#9aa4ad;flex-shrink:0;}
  .rv-status-dot.rv-open-now{background:#3ecf6e;}
  .rv-status-dot.rv-closed-now{background:#8a94a0;}
  .rv-header-text .rv-subline{font-size:11.5px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rv-header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .rv-emergency-btn{
    background:var(--rv-emergency);color:#fff;border:none;border-radius:20px;padding:6px 10px;
    font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .rv-emergency-btn:hover{background:var(--rv-emergency-dark);}
  .rv-close-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;
    cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;}

  @media (max-width:400px){
    .rv-header{flex-wrap:wrap;}
    .rv-emergency-btn{font-size:10px;padding:5px 8px;}
    .rv-header-text .rv-name{font-size:13px;}
  }

  /* menu view */
  #rv-menu{flex:1;overflow-y:auto;padding:18px 16px;background:#fff;}
  #rv-menu .rv-menu-avatar{width:64px;height:64px;border-radius:50%;background:var(--rv-dark);margin:0 auto 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #rv-menu .rv-menu-avatar img{width:88%;height:88%;object-fit:contain;}
  #rv-menu .rv-greeting{text-align:center;font-size:15px;font-weight:600;color:var(--rv-text);margin-bottom:4px;}
  #rv-menu .rv-greeting-sub{text-align:center;font-size:12.5px;color:#5a6675;margin-bottom:16px;line-height:1.4;}
  #rv-status-badge{
    display:block;text-align:center;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
    margin:0 auto 16px;width:fit-content;background:var(--rv-grey-bubble);color:#46525f;
  }
  #rv-status-badge.rv-open-now{background:#e6f7ec;color:#1f8a45;}
  #rv-status-badge.rv-closed-now{background:#f1f3f5;color:#5a6675;}

  .rv-menu-btn{
    display:block;width:100%;text-align:center;padding:12px 14px;border-radius:12px;border:none;
    font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;text-decoration:none;
  }
  #rv-emergency-menu-btn{background:var(--rv-emergency);color:#fff;}
  #rv-emergency-menu-btn:hover{background:var(--rv-emergency-dark);}
  #rv-start-chat-btn{background:var(--rv-dark);color:#fff;}
  #rv-book-btn{background:#ffe3e3;color:var(--rv-red-dark);border:1px solid #ffc2c2;}

  .rv-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;}
  .rv-chip{
    background:var(--rv-grey-bubble);border:1px solid #dfe4e9;color:var(--rv-dark);
    border-radius:16px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  .rv-chip:hover{background:#e2e7ec;}

  /* chat view */
  #rv-chat{flex:1;display:none;flex-direction:column;overflow:hidden;}
  #rv-chat.rv-active{display:flex;}
  #rv-messages{flex:1;overflow-y:auto;padding:14px;background:var(--rv-grey-bg);display:flex;flex-direction:column;gap:10px;}
  .rv-msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4;}
  .rv-msg.rv-bot{background:#fff;color:var(--rv-text);align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .rv-msg.rv-user{background:var(--rv-dark);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .rv-msg-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .rv-msg-links a{background:var(--rv-mauve-light);color:var(--rv-mauve);border-radius:14px;padding:6px 10px;font-size:12px;text-decoration:none;font-weight:600;}
  .rv-msg-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .rv-msg-suggestions button{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--rv-dark);}
  .rv-typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .rv-typing span{width:6px;height:6px;background:#9aa4ad;border-radius:50%;display:inline-block;margin:0 2px;animation:rv-blink 1s infinite ease-in-out;}
  .rv-typing span:nth-child(2){animation-delay:.15s;}
  .rv-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes rv-blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  #rv-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #e6e9ec;background:#fff;flex-shrink:0;}
  #rv-input{flex:1;border:1px solid #dfe4e9;border-radius:20px;padding:9px 14px;font-size:13.5px;outline:none;}
  #rv-input:focus{border-color:var(--rv-mauve);}
  #rv-send{background:var(--rv-dark);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;flex-shrink:0;font-size:16px;}
  #rv-back-btn{background:none;border:none;color:var(--rv-mauve);font-size:12px;cursor:pointer;padding:8px 10px 0;text-align:left;}
</style>
</head>
<body>

<div id="rv-widget-root">
  <button id="rv-launcher" aria-label="Open chat">
    <img id="rv-logo-launcher" alt="Ripley Vet">
  </button>

  <div id="rv-teaser">
    <button id="rv-teaser-close" aria-label="Dismiss">&times;</button>
    <span id="rv-teaser-text">Hi I'm Ripley Vet's assistant, here to help 24/7.</span>
  </div>

  <div id="rv-card">
    <div class="rv-header">
      <div class="rv-avatar">
        <img id="rv-logo-header" alt="Ripley Vet">
      </div>
      <div class="rv-header-text">
        <div class="rv-name"><span class="rv-status-dot" id="rv-status-dot"></span>Ripley Vet's Assistant</div>
        <div class="rv-subline" id="rv-header-subline">Mon&ndash;Fri 7:30am&ndash;6pm, Sat 8am&ndash;12:30pm</div>
      </div>
      <div class="rv-header-actions">
        <button id="rv-header-emergency" class="rv-emergency-btn">Emergency</button>
        <button id="rv-close-btn" class="rv-close-btn" aria-label="Close">&times;</button>
      </div>
    </div>

    <div id="rv-menu">
      <div class="rv-menu-avatar">
        <img id="rv-logo-menu" alt="Ripley Vet">
      </div>
      <div class="rv-greeting">Hi I'm Ripley Vet's assistant, here to help 24/7.</div>
      <div class="rv-greeting-sub">Ask me about accreditations, hours, the team, services, or anything else &mdash; I'm here to help.</div>
      <span id="rv-status-badge">Checking hours&hellip;</span>

      <button id="rv-emergency-menu-btn" class="rv-menu-btn">&#9888; Pet emergency? Tap here</button>
      <button id="rv-start-chat-btn" class="rv-menu-btn">Start a new chat</button>
      <a href="#" id="rv-book-btn" class="rv-menu-btn">Book Online</a>

      <div class="rv-chip-row" id="rv-chip-row">
        <button class="rv-chip" data-q="What are your opening hours?">&#128337; Hours</button>
        <button class="rv-chip" data-q="What are your accreditations?">&#127942; Accreditations</button>
        <button class="rv-chip" data-q="Where are you located?">&#128205; Location</button>
        <button class="rv-chip" data-q="What payment methods do you accept?">&#128179; Payments</button>
      </div>
    </div>

    <div id="rv-chat">
      <button id="rv-back-btn">&larr; Back to menu</button>
      <div id="rv-messages"></div>
      <div id="rv-input-row">
        <input id="rv-input" type="text" placeholder="Ask a question...">
        <button id="rv-send" aria-label="Send">&#10148;</button>
      </div>
    </div>
  </div>
</div>

  /* =====================================================
     Dynamic open/closed status (clinic's own timezone)
     ===================================================== */
  function getClinicNow(){
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: _CONFIG.clinicTimeZone,
      hour12:false, weekday:'short', hour:'2-digit', minute:'2-digit'
    }).formatToParts(new Date());
    var map = {};
    parts.forEach(function(p){ map[p.type] = p.value; });
    var dayMap = {Sun:'sun',Mon:'mon',Tue:'tue',Wed:'wed',Thu:'thu',Fri:'fri',Sat:'sat'};
    return { day: dayMap[map.weekday], hour: parseInt(map.hour,10), minute: parseInt(map.minute,10) };
  }

  function computeStatus(){
    var now = getClinicNow();
    var todayHours = _CONFIG.businessHours[now.day];
    if (!todayHours){
      return { open:false, known:true, label:"Closed today", subline:"Closed today &middot; call " + _CONFIG.phone + " for emergencies" };
    }
    var nowMinutes = now.hour*60 + now.minute;
    var openParts = todayHours.open.split(":").map(Number);
    var closeParts = todayHours.close.split(":").map(Number);
    var openMinutes = openParts[0]*60+openParts[1];
    var closeMinutes = closeParts[0]*60+closeParts[1];
    var isOpen = nowMinutes >= openMinutes && nowMinutes < closeMinutes;
    return {
      open:isOpen, known:true,
      label: isOpen ? "Open now" : "Closed now",
      subline: isOpen ? ("Open until " + todayHours.close) : ("Currently closed &middot; opens " + todayHours.open)
    };
  }

  function refreshStatus(){
    var status = computeStatus();
    statusDot.className = 'rv-status-dot' + (status.open ? ' rv-open-now' : ' rv-closed-now');
    statusBadge.textContent = status.label;
    statusBadge.className = status.open ? 'rv-open-now' : 'rv-closed-now';
    headerSubline.innerHTML = status.subline;

    headerEmergency.onclick = function(e){ e.preventDefault(); openEmergencyInChat(); };
    menuEmergencyBtn.onclick = function(e){ e.preventDefault(); openEmergencyInChat(); };
  }
  refreshStatus();
  setInterval(refreshStatus, 60000);

  /* =====================================================
     Launcher idle bounce (every ~8s while closed)
     ===================================================== */
  var bounceTimer = null;
  function startBounce(){
    if (bounceTimer) return;
    bounceTimer = setInterval(function(){
      launcher.classList.remove('rv-bounce');
      void launcher.offsetWidth;
      launcher.classList.add('rv-bounce');
    }, 8000);
  }
  function stopBounce(){
    if (bounceTimer){ clearInterval(bounceTimer); bounceTimer = null; }
  }
  startBounce();

  /* =====================================================
     Persistent teaser bubble
     ===================================================== */
  var teaserDismissed = false;
  function positionTeaser(){
    // Fully hidden (not just repositioned) while the card is open, so
    // nothing peeks out from behind the open menu/chat card.
    if (card.classList.contains('rv-open')){
      teaser.classList.remove('rv-show');
      return;
    }
    teaser.style.bottom = "94px";
    if (!teaserDismissed){
      teaser.classList.add('rv-show');
    }
  }
  setTimeout(function(){
    if (!teaserDismissed && !card.classList.contains('rv-open')){
      positionTeaser();
    }
  }, 1800);

  teaserClose.addEventListener('click', function(e){
    e.stopPropagation();
    teaserDismissed = true;
    teaser.classList.remove('rv-show');
  });
  teaser.addEventListener('click', function(){ openCard(); });

  /* =====================================================
     Open / close card
     ===================================================== */
  function openCard(){
    card.classList.add('rv-open');
    stopBounce();
    positionTeaser();
  }
  function closeCard(){
    card.classList.remove('rv-open');
    startBounce();
    positionTeaser();
  }
  launcher.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);

  function contains(text, words){
    for (var i=0;i<words.length;i++){ if (text.indexOf(words[i]) !== -1) return true; }
    return false;
  }

    return "Please call us straight away on " + _CONFIG.phone + ". Don't wait for a chat reply &mdash; a phone call gets your pet seen fastest.";

  ];

  // ---- Non-emergency symptom (calmer tier, recommends booking a visit) ----
  var SYMPTOM_TRIGGERS = [
    "fever","temperature","limping","lame","itchy","itching","rash",
    "not eating","off his food","off her food","off food","diarrhea","diarrhoea",
    "lethargic","lethargy","coughing","sneezing","discharge","swelling","lump",
    "not himself","not herself","unwell","bee sting","insect bite","bite"
  ];

  var KB = [
    {
      id:"contact",
      triggers:["contact","phone number","your number","email address","how do i reach you","get in touch","contact number","phone","email","call you","reach you"],
      answer:"You can reach us on " + _CONFIG.phone + " or by email at " + _CONFIG.email + "."
    },
    {
      id:"accreditations",
      triggers:["accredit","accreditation","accreditations","certified","certification","award","excellence","quality","member of","affiliated","asav","cvs group","business for good"],
      answer:"We're proud to be one of only four accredited veterinary hospitals of excellence in Queensland, accredited under the Australian Small Animal Veterinarians Group Accredited Veterinary Hospital Scheme. We're also part of the Business for Good Initiative, our charitable giving program, and part of the CVS Veterinary Group network."
    },
    {
      id:"booking",
      triggers:["book","booking","appointment","schedule","make an appointment"],
      answer:"You can book online through our appointment portal, or call reception on " + _CONFIG.phone + ".",
      links:[{label:"Book Online", href:_CONFIG.bookingUrl}]
    },
    {
      id:"hours",
      triggers:["hours","open today","opening hours","what time","close","closing time","weekend","saturday","sunday","public holiday"],
      answer:"We're open Monday to Friday 7:30am to 6:00pm, and Saturday 8:00am to 12:30pm. We're closed Sunday."
    },
    {
      id:"location",
      triggers:["location","address","where are you","directions","find you","where are you located","parking"],
      answer:"We're at " + _CONFIG.address + ", in the Ripley Town Centre. Parking is available from both Main Street and the town centre car park."
    },
    {
      id:"doctors",
      triggers:["doctors","vets","who are the vets","who is the vet","veterinarian","dr hemming","dr biddle","dr park","dr lee","dr kuok"],
      answer:"Our vet team includes Dr Andrew Hemming (Senior Veterinarian), Dr Jessica Biddle (Head Veterinarian, with an emergency and critical care background), Dr Katie Park, Dr Sam Lee, and Dr Kerrie Kuok."
    },
    {
      id:"team",
      triggers:["team","staff","practice manager","nurse","receptionist","who works there","liaison"],
      answer:"Alongside our vets, our team includes Head Veterinary Nurse Stephanie Robinson, several veterinary nurses, veterinary liaisons who are current UQ veterinary science students, client liaisons, and Practice Manager Tanya Kunzel. We even have two resident clinic cats, Marjorie and Meika!"
    },
    {
      id:"services",
      triggers:["services","what do you offer","what do you do","do you do","treatments"],
      answer:"We offer consultations, preventative medicine, surgery, dentistry, anaesthesia, x-ray and ultrasound, diagnostics, vaccinations and titre testing, house calls, puppy preschool, visiting specialists, and euthanasia."
    },
    {
      id:"pricing",
      triggers:["how much","cost","price","pricing","fee","consult fee","cat consult","dog consult","checkup cost","consultation cost"],
      answer:"Consultation pricing isn't published online &mdash; call " + _CONFIG.phone + " for current pricing. Our Puppy Preschool is a published $180 for the full 4 week program."
    },
    {
      id:"xray",
      triggers:["xray","x-ray","x ray","radiography","ultrasound","imaging"],
      answer:"Yes, we have a dedicated in house X-ray room with medical grade equipment, along with ultrasound for non invasive diagnostic imaging including pregnancy staging and trauma assessment."
    },
    {
      id:"surgery",
      triggers:["surgery","desex","desexing","spay","neuter","operation","dentistry","dental"],
      answer:"Yes, our team is experienced across surgery, dermatology, oncology, dentistry, behaviour and rehabilitation, with specialist quality dental equipment and anaesthesia delivered to specialist standards."
    },
    {
      id:"vaccination",
      triggers:["vaccination","vaccine","vaccinations","vaccinate","shots","booster","titre"],
      answer:"Puppies and kittens need an initial course of 3 vaccines, 4 weeks apart, then annual vaccination after that. Dogs are covered for 5 core diseases and cats for 3, with FIV also offered for outdoor cats. We also offer titre testing for dogs."
    },
    {
      id:"housecalls",
      triggers:["house call","house calls","home visit","home visits","come to my house","mobile vet","at home"],
      answer:"Yes, we offer house calls for annual check ups, general consults, and at home euthanasia, using fear free techniques so your pet stays calm in their own environment. Available within and around the Ripley community, advance notice appreciated."
    },
    {
      id:"puppyschool",
      triggers:["puppy school","puppy preschool","puppy class","puppy training"],
      answer:"Yes, our Puppy Preschool runs over 4 weeks on Tuesday evenings from 6:00 to 7:00pm, for puppies 8 to 14 weeks old, capped at 4 to 6 puppies. It's $180 for the full program, including a graduation night and a behind the scenes hospital tour. Call " + _CONFIG.phone + " to enrol."
    },
    {
      id:"specialists",
      triggers:["specialist","specialists","cardiologist","cardiology","referral","refer"],
      answer:"We bring visiting specialists in rather than always referring you elsewhere: Dr Geoff Nicholson (veterinary cardiologist, one of only six in Australia), Dr Tasmiya Hussein (abdominal ultrasound), and Dr Tom Smith (small animal specialist surgeon, 20+ years experience)."
    },
    {
      id:"euthanasia",
      triggers:["euthanasia","put down","end of life","put to sleep","say goodbye"],
      answer:"We offer euthanasia in clinic, in a private room where you can take the time you need to say goodbye, or at home as part of our house call service. Call " + _CONFIG.phone + " to talk through the options and aftercare."
    },
    {
      id:"payment",
      triggers:["payment methods","how can i pay","do you take card","afterpay","payment plan","zip pay","vetpay","gaponly"],
      answer:"We accept EFTPOS, Visa and Mastercard, and cash. We also support GapOnly for real time insurance claims, and VetPay for flexible payment plans (20% initial deposit then fortnightly repayments, 5% surcharge applies). We don't offer our own in house payment plans."
    },
    {
      id:"insurance",
      triggers:["insurance","pet insurance","claim","gap payment","petcover"],
      answer:"Petcover is our preferred insurance partner and our team can help with Petcover claims. We also support GapOnly, so if your insurer participates, you simply pay the gap and go."
    },
    {
      id:"boarding",
      triggers:["boarding","kennel","board my pet","overnight stay"],
      answer:"We don't offer boarding. For anything else we can help with &mdash; consultations, house calls, surgery, dental, or diagnostics &mdash; call " + _CONFIG.phone + "."
    },
    {
      id:"differentiator",
      triggers:["why choose","what makes you different","why ripley vet","special about"],
      answer:"We're one of only four ASAV accredited hospitals of excellence in Queensland, part of the Business for Good Initiative and the CVS Veterinary Group network, and we bring visiting specialists on site instead of always referring out, alongside specialist quality equipment and a dedicated puppy preschool program."
    },
    {
      id:"philosophy",
      triggers:["your story","your philosophy","tell me about ripley vet","about the clinic","your vision"],
      answer:"Established in 2009 and reopened in our purpose built facility in 2018, we're focused on setting the standards in veterinary care, with a strong emphasis on diagnostics, open communication, and getting to the root cause of your pet's health concerns."
    },
    {
      id:"symptom",
      triggers:SYMPTOM_TRIGGERS,
      answer:"I can't diagnose that over chat, so it's best to have a vet take a look. Book a consultation so we can properly check your pet &mdash; call " + _CONFIG.phone + " or book online. If things get noticeably worse quickly, please treat it as an emergency and call us straight away."
    },
    {
      id:"emergency",
      triggers:EMERGENCY_TRIGGERS,
      answer:"" // filled dynamically
    }
  ];

  var FALLBACK_ANSWER = "I'm not sure about that one. You can call us on " + _CONFIG.phone + " or email " + _CONFIG.email + " and the team will help directly.";

  function matchMessage(raw){
    var text = (raw || "").toLowerCase();

    // Emergency runs first and wins.
    if (contains(text, EMERGENCY_TRIGGERS)){
      return { id:"emergency", answer: emergencyAnswerText(), links: emergencyLinks() };
    }

    var best = null, bestScore = 0;
    for (var i=0;i<KB.length;i++){
      var intent = KB[i];
      if (intent.id === "emergency") continue; // handled above
      var score = 0;
      for (var j=0;j<intent.triggers.length;j++){
        if (text.indexOf(intent.triggers[j]) !== -1){ score += intent.triggers[j].length; }
      }
      if (score > bestScore){ bestScore = score; best = intent; }
    }
    if (best) return best;
    return { id:"fallback", answer: FALLBACK_ANSWER };
  }

  function openEmergencyInChat(){
    messagesEl.innerHTML = "";
    onboardingStage = 'done';
    openChatView();
    addMessage("Emergency", 'user');
    // Built directly rather than run through matchMessage(), since the
    // button's own label ("Emergency") is not itself one of the trigger
    // phrases we listen for in free-form user text.
    var match = { id:"emergency", answer: emergencyAnswerText(), links: emergencyLinks() };
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  }

  /* =====================================================
     Chat rendering
     ===================================================== */
  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(text, who, links, suggestions){
    var el = document.createElement('div');
    el.className = 'rv-msg rv-' + who;
    el.innerHTML = text;
    if (links && links.length){
      var linksWrap = document.createElement('div');
      linksWrap.className = 'rv-msg-links';
      links.forEach(function(l){
        var a = document.createElement('a');
        a.href = l.href; a.textContent = l.label;
        if (/^https?:/.test(l.href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
        linksWrap.appendChild(a);
      });
      el.appendChild(linksWrap);
    }
    if (suggestions && suggestions.length){
      var sugWrap = document.createElement('div');
      sugWrap.className = 'rv-msg-suggestions';
      suggestions.forEach(function(s){
        var b = document.createElement('button');
        b.textContent = s;
        b.addEventListener('click', function(){ handleUserText(s); });
        sugWrap.appendChild(b);
      });
      el.appendChild(sugWrap);
    }
    messagesEl.appendChild(el);
    scrollToBottom();
  }

  function showTyping(cb){
    var el = document.createElement('div');
    el.className = 'rv-typing';
    el.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(el);
    scrollToBottom();
    setTimeout(function(){
      messagesEl.removeChild(el);
      cb();
    }, 500);
  }

  /* =====================================================
     Onboarding intake state machine
     ===================================================== */
  var onboardingStage = 'done'; // 'name' -> 'petname' -> 'condition' -> 'done'
  var ownerName = "", petName = "";

  function startIntake(){
    onboardingStage = 'name';
    addMessage("Before we dive in, what's your name?", 'bot');
  }

  function handleOnboarding(text){
    if (onboardingStage === 'name'){
      ownerName = text.trim();
      onboardingStage = 'petname';
      showTyping(function(){
        addMessage("Lovely to meet you, " + escapeHtml(ownerName) + "! What's your pet's name?", 'bot');
      });
      return;
    }
    if (onboardingStage === 'petname'){
      petName = text.trim();
      onboardingStage = 'condition';
      showTyping(function(){
        addMessage("Great &mdash; and what's going on with " + escapeHtml(petName) + " today? You can describe what's happening, or just ask me about booking, hours, services and more.", 'bot');
      });
      return;
    }
    if (onboardingStage === 'condition'){
      onboardingStage = 'done';
      var match = matchMessage(text);
      showTyping(function(){
        addMessage("Thanks, " + escapeHtml(ownerName) + " &mdash; noted for " + escapeHtml(petName) + ". " + match.answer, 'bot', match.links);
      });
      return;
    }
  }

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function handleUserText(text){
    if (!text) return;
    addMessage(escapeHtml(text), 'user');
    if (onboardingStage !== 'done'){
      handleOnboarding(text);
      return;
    }
    var match = matchMessage(text);
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  }

  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ sendCurrentInput(); }
  });
  sendBtn.addEventListener('click', sendCurrentInput);
  function sendCurrentInput(){
    var v = inputEl.value;
    inputEl.value = "";
    handleUserText(v);
  }

  function openChatView(){
    menu.style.display = 'none';
    chat.classList.add('rv-active');
  }
  function openMenuView(){
    chat.classList.remove('rv-active');
    menu.style.display = 'block';
  }

  startChatBtn.addEventListener('click', function(){
    messagesEl.innerHTML = "";
    openChatView();
    onboardingStage = 'done'; // reset guard, then trigger intake explicitly
    startIntake();
  });

  backBtn.addEventListener('click', openMenuView);

  // Quick-intent chips: bypass intake entirely, feed straight into matcher.
  chipRow.addEventListener('click', function(e){
    var btn = e.target.closest('.rv-chip');
    if (!btn) return;
    var q = btn.getAttribute('data-q');
    messagesEl.innerHTML = "";
    onboardingStage = 'done'; // chips never trigger the name/pet intake
    openChatView();
    addMessage(escapeHtml(q), 'user');
    var match = matchMessage(q);
    showTyping(function(){
      addMessage(match.answer, 'bot', match.links);
    });
  });

  /* =====================================================
     Test harness (opt-in only via ?ripleyvettest=1)
     ===================================================== */
  window.RIPLEYVET_TEST = {
    cases: [
      { name:"accreditations bug fix", input:"explain the accreditations", expectIntentId:"accreditations", expectContains:"four accredited veterinary hospitals" },
      { name:"hours", input:"what are your hours on saturday", expectIntentId:"hours", expectContains:"12:30pm" },
      { name:"named toxin emergency", input:"my dog ate chocolate", expectIntentId:"emergency", expectContains:"07 3816 4717" },
      { name:"multi-symptom emergency combo", input:"vomiting and won't wake up", expectIntentId:"emergency", expectContains:"07 3816 4717" },
      { name:"non-emergency symptom", input:"my dog has a fever", expectIntentId:"symptom", expectNotContains:"don't wait for a chat reply" },
      { name:"bare contact phrasing", input:"contact number", expectIntentId:"contact", expectContains:"07 3816 4717" },
      { name:"emergency false positive guard", input:"do you offer x-ray?", expectIntentId:"xray", expectNotContains:"07 3816 4717" },
      { name:"booking with real url", input:"how do i book an appointment", expectIntentId:"booking", expectContains:"book online" },
      { name:"not-offered service (boarding)", input:"do you offer boarding", expectIntentId:"boarding", expectContains:"don't offer boarding" },
      { name:"specialists phrasing", input:"do you have any visiting specialists", expectIntentId:"specialists", expectContains:"Nicholson" }
    ],
    runAll: function(){
      var pass = 0, fail = 0;
      this.cases.forEach(function(c){
        var result = matchMessage(c.input);
        var ok = true, reasons = [];
        if (c.expectIntentId && result.id !== c.expectIntentId){ ok = false; reasons.push("expected intent " + c.expectIntentId + " got " + result.id); }
        if (c.expectContains && result.answer.toLowerCase().indexOf(c.expectContains.toLowerCase()) === -1){ ok = false; reasons.push("missing text: " + c.expectContains); }
        if (c.expectNotContains && result.answer.toLowerCase().indexOf(c.expectNotContains.toLowerCase()) !== -1){ ok = false; reasons.push("should not contain: " + c.expectNotContains); }
        if (ok){ pass++; console.log("PASS", c.name); }
        else { fail++; console.warn("FAIL", c.name, reasons.join("; "), result); }
      });
      var statusResult = computeStatus();
      var statusOk = typeof statusResult.open === 'boolean';
      console.log(statusOk ? "PASS" : "FAIL", "status function well-formed", statusResult);
      console.log("RIPLEYVET_TEST summary:", pass, "passed,", fail, "failed (+1 status check)");
      return { pass:pass, fail:fail };
    }
  };
  if (/[?&]ripleyvettest=1/.test(window.location.search)){
    window.addEventListener('load', function(){ window.RIPLEYVET_TEST.runAll(); });
  }

})();
</script>
